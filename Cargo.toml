[package]
name = "hello_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bcrypt = "0.17"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { 
    version = "0.7.4",
    features = [
        "runtime-tokio",
        "mysql",
        "macros",
        "uuid",
        "chrono"
    ]
}
dotenvy = "0.15.7"
